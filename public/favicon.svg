<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)"/>

  <!-- Snow mountain -->
  <polygon points="32,10 52,48 12,48" fill="url(#mountainGrad)" opacity="0.6"/>
  <polygon points="32,10 42,30 22,30" fill="white" opacity="0.85"/>

  <!-- Skier body -->
  <!-- Head -->
  <circle cx="38" cy="20" r="4" fill="white"/>
  <!-- Body -->
  <line x1="38" y1="24" x2="34" y2="36" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="36" y1="28" x2="28" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm / pole -->
  <line x1="37" y1="28" x2="44" y2="34" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Left ski -->
  <line x1="32" y1="36" x2="22" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right ski -->
  <line x1="34" y1="36" x2="44" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ski tips left -->
  <line x1="22" y1="42" x2="19" y2="40" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Ski tips right -->
  <line x1="44" y1="42" x2="47" y2="40" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Pole bottom -->
  <line x1="44" y1="34" x2="47" y2="42" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Snowflake top left -->
  <g transform="translate(10,12)" opacity="0.9">
    <line x1="5" y1="0" x2="5" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="10" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1.5" y1="1.5" x2="8.5" y2="8.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="8.5" y1="1.5" x2="1.5" y2="8.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Snowflake bottom right small -->
  <g transform="translate(46,46)" opacity="0.7">
    <line x1="4" y1="0" x2="4" y2="8" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="8" y2="4" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="1" y1="1" x2="7" y2="7" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="7" y1="1" x2="1" y2="7" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
